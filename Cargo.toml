[package]
name = "openai-endpoint"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "OpenAI-compatible endpoint plugin for mesh-llm"
repository = "https://github.com/Mesh-LLM/openai-endpoint"

[dependencies]
anyhow = "1"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "557630fd0a543aecd2f2b8ef5232ec1829865115" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
